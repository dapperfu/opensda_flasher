; Default init for S32 Design Studio for Power Architecture 2.1.
; Executables are resolved from --sd32 / --gdb, then path=, then PATH.

[S32]
root = /opt/S32PA

[SERVER]
exe = pegdbserver_power_console
path =
device = MPC5744P
port = USB1
speed = 5000
serverport = 7224
corenum = 0
interface = OPENSDA

[CLIENT]
exe = powerpc-eabivle-gdb
path =
