[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensda-flasher"
dynamic = ["version"]
description = "Click CLI to flash NXP DEVKIT-MPC57xx boards over OpenSDA."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "Jedediah Frey", email = "opensda_flasher@exstatic.org" },
]
keywords = ["opensda", "mpc5744p", "s32ds", "pegdbserver", "flash"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "click",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[project.urls]
Homepage = "https://github.com/jed-frey/opensda_flasher"

[project.scripts]
osf = "opensda_flasher.cli:main"
opensda_flasher = "opensda_flasher.cli:main"

[tool.hatch.version]
path = "opensda_flasher/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["opensda_flasher"]

[tool.hatch.build.targets.sdist]
include = [
    "/opensda_flasher",
    "/docs",
    "/README.md",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "venv", "Golden_Binaries"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
